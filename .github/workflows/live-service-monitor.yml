name: Live service monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

# ALERT RECIPIENT: bbusch@millcreekut.gov, accepted by the GIS/data owner on
# 26 August 2026, weekly cadence.
#
# There is no recipient list in this file, and that is not an omission. GitHub
# emails the account owner when a scheduled workflow fails; sending mail from the
# job itself would need an SMTP credential this project deliberately does not
# hold. So the address above is only correct while it is the notification address
# on the GitHub account, with Actions failure notifications enabled. Nothing in CI
# can assert that — confirm it in GitHub notification settings.
#
# When ownership moves to a Millcreek organization, move this to a shared address.
# An individual's inbox means a failing monitor goes unread during any absence,
# and this job exists precisely to be read.

permissions:
  contents: read

concurrency:
  group: live-service-monitor
  cancel-in-progress: false

jobs:
  live-service-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # The script writes its own step summary, naming every failed contract and
      # separating drift (the published data changed; the page may now be wrong)
      # from transport failure that survived the retries (the service is down,
      # which is not Millcreek's to fix). The tee'd log is kept as backup for a
      # crash before the report is written.
      - name: Check live service contracts
        shell: bash
        run: |
          set +e
          npm run check:services 2>&1 | tee service-contract.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ ! -s service-contract-report.json ]; then
            {
              echo "## Live service contract"
              echo
              echo "The monitor did not produce a report - it failed before finishing."
              echo
              echo '```text'
              tail -n 40 service-contract.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      # Retained whether the run passed or failed. A clean report is the evidence a
      # release candidate needs; a failed one is what the recipient acts on. It is
      # sanitized by construction - the parcel queries use outFields=*, so owner
      # names pass through the process that writes it and must never reach the file.
      - name: Upload the service contract report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-contract-${{ github.run_id }}
          path: |
            service-contract-report.json
            service-contract.txt
          if-no-files-found: warn
          retention-days: 90
