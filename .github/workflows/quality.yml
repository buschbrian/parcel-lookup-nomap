name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm test` runs the Python flood-rank tests, and Playwright's webServer is
      # `python -m http.server`. Both need `python` on PATH by that name. Provision it
      # rather than depending on whichever alias the runner image happens to ship.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  live-service-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check:services
