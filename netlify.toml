# Netlify configuration for the Millcreek Property Lookup.
#
# This app is deployed as its OWN Netlify site, deliberately separate from the
# Experience Builder site at maps.millcreekut.gov. Reason: an ExB Developer
# Edition deploy replaces the whole publish directory, which would silently
# delete this app if it lived inside that site.
#
# Any clean public URL hosted by another Millcreek site must be configured in
# that site's own routing configuration. Deployment and rollback notes live in README.md.

[build]
  # ADR-0001: the site is built by Vite and the published artifact is `dist/`.
  # Netlify resolves the build Node version from `.nvmrc`, the same source used
  # by developers and GitHub Actions. Do not remove it or allow it to drift from
  # the exact `package.json` engines contract.
  #
  # Publish the BUILD OUTPUT, never the repository root. The root contains the
  # code walkthrough, migration notes, the data-source review register, the
  # service contract script with its known test parcels, and the test suite —
  # all of which were served over HTTP when this was ".". What ships remains an
  # allowlist, now enforced by the build rather than by directory discipline:
  # only entry HTML, its bundled assets, and everything in `public/` reach
  # `dist/`. `scripts/check-deployment.mjs` proves it after every deploy.
  #
  # `_headers` still lives in `public/` — Netlify only honours it from the
  # publish directory, and Vite copies `public/` into `dist/` verbatim, so it
  # lands at `dist/_headers`. Moving it out silently drops every security header.
  publish = "dist"
  command = "npm run build"

[[redirects]]
  # A readable URL for the focused short-term-rental licensing screen.
  from = "/business-licensing"
  to = "/business-licensing.html"
  status = 200

[[redirects]]
  # Send unknown paths to the app rather than a Netlify 404, so a mistyped
  # deep link still reaches a working lookup form.
  from = "/*"
  to = "/index.html"
  status = 200

# Response headers have one source of truth: _headers.
