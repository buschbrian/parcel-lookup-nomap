name: Quality checks

on:
  # Pushes are checked on main only: a branch with an open pull request would
  # otherwise run this twice for the same commit.
  push:
    branches: [main]
  # Every pull request, whatever it targets. Filtering to `main` meant a pull
  # request stacked on another branch — how this plan's phases are reviewed —
  # ran no checks at all, and could land unverified in the branch that later
  # merges to main as one already-approved lump.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # The Python unit suite and Playwright's local static server both require the
      # `python` command. Provision it instead of relying on the runner image.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production toolchain
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Python tests
        run: npm run test:python

      - name: Build production artifact
        run: npm run build

      # The one step in this "deterministic" job that is not deterministic. Playwright's
      # --with-deps runs apt-get update, which consults the third-party repositories the
      # runner image happens to have configured. On 27 August 2026 two Microsoft apt
      # repositories returned 403 and the step died with code 100, failing a pull request
      # whose change was documentation. A workflow_dispatch run on the same commit passed
      # minutes later, and a re-run passed too.
      #
      # So: retry it, on the same reasoning the service monitor uses — transport failure
      # is worth another attempt, and nothing else here is. Every other step in this job
      # depends only on the lockfile and this repository, and none of them is retried.
      - name: Install Chromium
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium install attempt $attempt failed (usually an apt mirror or third-party repo); retrying"
            sleep $((attempt * 15))
          done
          echo "::error::Chromium install failed three times - this is no longer transient"
          exit 1

      - name: Run browser tests
        run: npx playwright test

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
